<?xml version="1.0" encoding="UTF-8"?>
<!-- REBEL_CELL: the Modem's vertical neon sign, MODEM / CYBER SHOP (original design, art pass
     W8c; ART_BIBLE 4.3 rule 5: baked art, translated by a subtitle where needed). A dark
     circuit board in a pink neon tube frame; MODEM stacked in angular pink tubes, CYBER SHOP
     in cyan tubes under it. Each tube is three strokes (wide faint halo, glow, bright core)
     so it reads as neon without filters. Laid out in six horizontal bands (ModemSign.BANDS:
     the five MODEM letters, then CYBER SHOP) so the warm-up can strike each band on its own.
     Colours: Palette.CELL_PINK #FF3DA8, NET_CYAN #5CE1FF, NIGHT_SKY #060816. 210 x 540. -->
<svg xmlns="http://www.w3.org/2000/svg" width="210" height="540" viewBox="0 0 210 540">
  <!-- the board -->
  <rect x="8" y="8" width="194" height="524" rx="26" ry="26" fill="#05060f" fill-opacity="0.96"/>
  <!-- board traces (thin pink, pads at their ends) -->
  <g fill="none" stroke="#FF3DA8" stroke-opacity="0.26" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 40 H40 L50 50 V92"/><path d="M188 58 H170 L162 66 V110"/>
    <path d="M24 130 H38 L46 138 V170 L54 178"/><path d="M186 150 H174 L166 158 V196"/>
    <path d="M22 214 H44 L52 222 V246"/><path d="M188 232 H168 L160 240 V270 L152 278"/>
