      <path d="M73 110 H137 L153 126 V150 L137 166 H73 L57 150 V126 Z"/>
      <path d="M57 176 H127 L153 196 V212 L127 232 H57 Z"/>
      <path d="M153 242 H57 V298 H153 M57 270 H131"/>
      <path d="M57 364 V308 L105 340 L153 308 V364"/>
