    <path d="M22 372 H40 L48 380 V392"/><path d="M188 376 H176 L168 384 V394"/>
    <path d="M30 506 H64 L72 498 H100"/><path d="M180 506 H148 L140 498 H118"/>
    <path d="M60 24 V34 H96"/><path d="M150 24 V34 H114"/>
  </g>
  <g fill="#FF3DA8" fill-opacity="0.5">
    <circle cx="50" cy="92" r="3"/><circle cx="162" cy="110" r="3"/><circle cx="54" cy="178" r="3"/>
    <circle cx="166" cy="196" r="3"/><circle cx="52" cy="246" r="3"/><circle cx="152" cy="278" r="3"/>
    <circle cx="44" cy="344" r="3"/><circle cx="164" cy="352" r="3"/><circle cx="100" cy="498" r="3"/>
    <circle cx="118" cy="498" r="3"/><circle cx="96" cy="34" r="2.5"/><circle cx="114" cy="34" r="2.5"/>
  </g>
  <!-- the frame tube -->
  <g fill="none" stroke-linejoin="round">
    <rect x="8" y="8" width="194" height="524" rx="26" ry="26" stroke="#FF3DA8" stroke-opacity="0.12" stroke-width="18"/>
    <rect x="8" y="8" width="194" height="524" rx="26" ry="26" stroke="#FF3DA8" stroke-opacity="0.32" stroke-width="8"/>
    <rect x="8" y="8" width="194" height="524" rx="26" ry="26" stroke="#FF8FCB" stroke-width="3"/>
  </g>
  <!-- MODEM: five letters, 96 x 56 each, bands at y 44, 110, 176, 242, 308 -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g id="letters-halo" stroke="#FF3DA8" stroke-opacity="0.14" stroke-width="16">
