  <g fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(41 446)">
    <g stroke="#5CE1FF" stroke-opacity="0.16" stroke-width="10">
      <path d="M26 0 H6 L0 6 V12 L6 17 H20 L26 22 V28 L20 34 H0"/>
      <path d="M34 0 V34 M60 0 V34 M34 17 H60"/>
      <path d="M74 0 H88 L94 6 V28 L88 34 H74 L68 28 V6 Z"/>
      <path d="M102 34 V0 H122 L128 6 V12 L122 17 H102"/>
