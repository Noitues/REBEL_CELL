name: CI

# PAUSED during M14 (designer, 2026-10-05): the old single-process full suite outran the 30-minute
# job limit on every push to main and was cancelled. The suite is now sharded (see the `checks`
# matrix below, docs/TEST_SUITE.md "CI" and DECISIONS "2026-10-05 — CI sharded"), but the triggers
# stay manual until M14 is over: run it from the Actions tab (Run workflow).
# To re-enable after ART-12 (M14): replace `on:` with the commented block below.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  # Number of GUT shards: keep equal to the length of the `shard` list in the checks matrix.
  SHARDS: 6

jobs:
  # Cheap checks, in their own job so a schema or content break shows up in about a minute.
  fast-checks:
    name: Runner tests, schema, content, text export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # ART-0 audit O2: the runner's own tests (--shard, --tier, balancing) run here too, not
      # only inside test_anim_r6_rules (full tier). Standard library only; no Godot needed.
      - name: Test runner unit tests
        run: python3 tools/test_run_tests.py
      - name: Cache the Godot download
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot
          key: godot-bin-${{ env.GODOT_VERSION }}-${{ runner.os }}
      - name: Set up Godot ${{ env.GODOT_VERSION }}
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false
      - name: Cache the Godot import cache
        uses: actions/cache@v4
        with:
          path: .godot
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', 'addons/**', 'assets/**', '**/*.import') }}
          restore-keys: godot-import-${{ env.GODOT_VERSION }}-
      - name: Import
        run: godot --headless --path . --import
      - name: Schema smoke test
        # Godot can segfault (exit 139) at quit after printing PASS: the output decides, not the exit code.
        run: |
          godot --headless --path . -s tools/schema_smoke_test.gd > schema_smoke.log 2>&1 || true
          cat schema_smoke.log
          grep -q "SCHEMA SMOKE TEST: PASS" schema_smoke.log
      - name: Content validation
        run: godot --headless --path . -s tools/validate_content.gd
      - name: Text export is current
        run: |
          godot --headless --path . -s tools/export_text.gd
          git diff --exit-code -- assets/text/strings.csv

  # The GUT suite, split into SHARDS global shards balanced by the measured script times in
  # tests/test_manifest.json (tools/run_tests.py --shard K/N); each shard runs its scripts in 2
  # local processes. Estimate: 1752 s of measured script time / 6 = ~292 s per shard on the dev PC;
  # assuming a runner 3x slower and 2 processes, ~7-8 min of tests plus 1-3 min of setup and import
  # (under 15 min); the job limit is 25.
  checks:
    name: GUT shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - name: Cache the Godot download
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot
          key: godot-bin-${{ env.GODOT_VERSION }}-${{ runner.os }}
      - name: Set up Godot ${{ env.GODOT_VERSION }}
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false
      - name: Cache the Godot import cache
        uses: actions/cache@v4
        with:
          path: .godot
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', 'addons/**', 'assets/**', '**/*.import') }}
          restore-keys: godot-import-${{ env.GODOT_VERSION }}-
      - name: Import
        run: godot --headless --path . --import
      - name: Tests (GUT shard ${{ matrix.shard }}/${{ env.SHARDS }})
        # Exits non-zero on any failure, crash or script that did not run; reruns failing scripts alone.
        run: python3 tools/run_tests.py --shard ${{ matrix.shard }}/${{ env.SHARDS }} -j 2 --out gut_out --timeout 1200
      - name: Upload the GUT logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gut-logs-shard-${{ matrix.shard }}
          path: |
            gut_out/**/gut.log
            gut_out/**/results.xml
          if-no-files-found: ignore
          retention-days: 14

  export:
    name: Export builds
    needs: [fast-checks, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cache the Godot download
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot
          key: godot-bin-templates-${{ env.GODOT_VERSION }}-${{ runner.os }}
      - name: Set up Godot ${{ env.GODOT_VERSION }}
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true
      - name: Cache the Godot import cache
        uses: actions/cache@v4
        with:
          path: .godot
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', 'addons/**', 'assets/**', '**/*.import') }}
          restore-keys: godot-import-${{ env.GODOT_VERSION }}-
      - name: Import
        run: godot --headless --path . --import
      - name: Export Windows
        run: mkdir -p build/windows && godot --headless --path . --export-release "Windows Desktop" build/windows/rebel_cell.exe
      - name: Export Linux
        run: mkdir -p build/linux && godot --headless --path . --export-release "Linux" build/linux/rebel_cell.x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: builds
          path: build/
